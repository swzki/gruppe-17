<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Prima, kleiner runder Roboter, steht in einer von Efeu überwucherten Straße, rostiges Auto, schwacher roter Signalpunkt in der Ferne, Morgengrau">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a4d"/>
      <stop offset="0.55" stop-color="#2c3a3c"/>
      <stop offset="1" stop-color="#1d2a2b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3b31"/>
      <stop offset="1" stop-color="#17211c"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d3"/>
      <stop offset="1" stop-color="#cfc0a6"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#ffdf9e"/>
      <stop offset="0.55" stop-color="#e8a83c"/>
      <stop offset="1" stop-color="#b06a1a"/>
    </radialGradient>
    <radialGradient id="signal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="0.5" stop-color="#c03322" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c03322" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Himmel / Morgengrau -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <rect y="400" width="960" height="140" fill="url(#ground)"/>

  <!-- ferner roter Signalpunkt -->
  <circle cx="795" cy="330" r="52" fill="url(#signal)"/>
  <circle cx="795" cy="330" r="5" fill="#ff6a48"/>

  <!-- Straße in der Tiefe -->
  <polygon points="480,400 300,540 660,540" fill="#232e28"/>
  <line x1="480" y1="402" x2="480" y2="540" stroke="#3c4a40" stroke-width="3" stroke-dasharray="18 14"/>

  <!-- rostiges Auto (übewuchert) -->
  <g>
    <rect x="120" y="330" width="250" height="70" rx="18" fill="#5a3a28"/>
    <rect x="160" y="296" width="170" height="52" rx="16" fill="#6b4630"/>
    <circle cx="175" cy="402" r="22" fill="#241c16"/>
    <circle cx="320" cy="402" r="22" fill="#241c16"/>
    <!-- Efeu -->
    <path d="M130 330 q-18 -40 10 -60 q26 -18 50 -2" fill="none" stroke="#4d6b45" stroke-width="7"/>
    <path d="M368 300 q30 -30 6 -58 q-24 -22 -44 -6" fill="none" stroke="#567a4c" stroke-width="6"/>
    <circle cx="150" cy="272" r="6" fill="#5d7d52"/>
    <circle cx="372" cy="252" r="6" fill="#5d7d52"/>
  </g>

  <!-- Prima -->
  <g>
    <!-- Rucksack -->
    <rect x="556" y="352" width="52" height="74" rx="16" fill="#6f6f6f"/>
    <rect x="560" y="346" width="44" height="18" rx="9" fill="#5a5a5a"/>
    <!-- Beine -->
    <rect x="560" y="430" width="26" height="34" rx="10" fill="#b9ad94"/>
    <rect x="606" y="430" width="26" height="34" rx="10" fill="#b9ad94"/>
    <!-- Körper -->
    <ellipse cx="610" cy="392" rx="72" ry="66" fill="url(#shell)"/>
    <!-- rostfarbene Kratzer -->
    <path d="M556 380 q14 8 26 4" stroke="#a8623a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M640 418 q16 -6 24 2" stroke="#a8623a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Arm, blickt in die Ferne (Antenne pulsiert) -->
    <rect x="528" y="376" width="26" height="14" rx="7" fill="#d8ccb4"/>
    <!-- Auge -->
    <circle cx="586" cy="384" r="26" fill="url(#eye)"/>
    <circle cx="579" cy="376" r="7" fill="#fff3d6" opacity="0.85"/>
    <!-- rote Antenne -->
    <line x1="612" y1="330" x2="612" y2="292" stroke="#c03322" stroke-width="6" stroke-linecap="round"/>
    <circle cx="612" cy="288" r="9" fill="#ff5a3c"/>
    <circle cx="612" cy="288" r="18" fill="#ff5a3c" opacity="0.25"/>
    <!-- Schatten -->
    <ellipse cx="610" cy="468" rx="86" ry="12" fill="#000" opacity="0.3"/>
  </g>

  <!-- Efeu an der Straßenseite -->
  <path d="M0 540 q40 -60 20 -120 q-14 -40 20 -70" fill="none" stroke="#4d6b45" stroke-width="8"/>
  <path d="M960 540 q-50 -70 -20 -130" fill="none" stroke="#567a4c" stroke-width="8"/>
</svg>
