<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Interaktion durch Schnitt: Shot A Prima und Lichtkern, Shot B Auge mit Echo-Reflexion, Shot C Echo-Hologramm, Montageschiene">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171f21"/>
      <stop offset="1" stop-color="#0e1416"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cfe8ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7fb2e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#ffdf9e"/>
      <stop offset="0.55" stop-color="#e8a83c"/>
      <stop offset="1" stop-color="#b06a1a"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="52" text-anchor="middle" fill="#f3ede3" font-size="26" font-weight="700" font-family="sans-serif">Interaktion durch Schnitt</text>

  <!-- Shot A -->
  <g>
    <rect x="50" y="90" width="270" height="170" rx="10" fill="#10181b" stroke="#3f5a66" stroke-width="2"/>
    <circle cx="185" cy="160" r="45" fill="url(#core)"/>
    <ellipse cx="150" cy="215" rx="34" ry="30" fill="#e6dcc6"/>
    <circle cx="140" cy="210" r="11" fill="url(#eye)"/>
    <line x1="122" y1="206" x2="96" y2="182" stroke="#d8ccb4" stroke-width="9" stroke-linecap="round"/>
    <text x="185" y="285" text-anchor="middle" fill="#e0a35c" font-size="15" font-weight="700" font-family="sans-serif">Shot A · Prima + Lichtkern</text>
    <text x="185" y="305" text-anchor="middle" fill="#8a8378" font-size="12.5" font-family="sans-serif">Hand ohne Berührung, Partikel in Post</text>
  </g>

  <!-- Shot B -->
  <g>
    <rect x="345" y="90" width="270" height="170" rx="10" fill="#10181b" stroke="#3f5a66" stroke-width="2"/>
    <circle cx="480" cy="165" r="55" fill="url(#eye)"/>
    <circle cx="466" cy="152" r="16" fill="#bfe0ff" opacity="0.9"/>
    <text x="480" y="285" text-anchor="middle" fill="#e0a35c" font-size="15" font-weight="700" font-family="sans-serif">Shot B · Insert Auge</text>
    <text x="480" y="305" text-anchor="middle" fill="#8a8378" font-size="12.5" font-family="sans-serif">Echo-Reflexion wird eingeblendet</text>
  </g>

  <!-- Shot C -->
  <g>
    <rect x="640" y="90" width="270" height="170" rx="10" fill="#10181b" stroke="#3f5a66" stroke-width="2"/>
    <ellipse cx="775" cy="160" rx="40" ry="38" fill="#9fc6ff" opacity="0.35"/>
    <ellipse cx="775" cy="160" rx="40" ry="38" fill="none" stroke="#bfe0ff" stroke-width="2" opacity="0.7"/>
    <circle cx="762" cy="156" r="11" fill="#bfe0ff" opacity="0.8"/>
    <line x1="776" y1="124" x2="776" y2="104" stroke="#6fa8e8" stroke-width="4" stroke-linecap="round"/>
    <g fill="#bfe0ff" opacity="0.6">
      <rect x="742" y="132" width="6" height="6"/>
      <rect x="800" y="170" width="6" height="6"/>
      <rect x="750" y="185" width="5" height="5"/>
    </g>
    <text x="775" y="285" text-anchor="middle" fill="#e0a35c" font-size="15" font-weight="700" font-family="sans-serif">Shot C · nur Echo</text>
    <text x="775" y="305" text-anchor="middle" fill="#8a8378" font-size="12.5" font-family="sans-serif">Hologramm, allein, ohne Prima</text>
  </g>

  <!-- Montage-Timeline -->
  <g font-family="sans-serif">
    <rect x="50" y="350" width="860" height="90" rx="10" fill="#10181b" stroke="#3f5a66" stroke-width="2"/>
    <text x="70" y="378" fill="#8a8378" font-size="13">Montage (schnell wechseln)</text>
    <g>
      <rect x="70" y="392" width="120" height="34" rx="6" fill="#d97a2b"/>
      <text x="130" y="414" text-anchor="middle" fill="#12181a" font-size="14" font-weight="700">A</text>
      <rect x="200" y="392" width="120" height="34" rx="6" fill="#8fb8e8"/>
      <text x="260" y="414" text-anchor="middle" fill="#12181a" font-size="14" font-weight="700">C</text>
      <rect x="330" y="392" width="120" height="34" rx="6" fill="#d97a2b"/>
      <text x="390" y="414" text-anchor="middle" fill="#12181a" font-size="14" font-weight="700">A</text>
      <rect x="460" y="392" width="120" height="34" rx="6" fill="#8fb8e8"/>
      <text x="520" y="414" text-anchor="middle" fill="#12181a" font-size="14" font-weight="700">C</text>
      <rect x="590" y="392" width="120" height="34" rx="6" fill="#e8a83c"/>
      <text x="650" y="414" text-anchor="middle" fill="#12181a" font-size="14" font-weight="700">B</text>
      <rect x="720" y="392" width="120" height="34" rx="6" fill="#8fb8e8"/>
      <text x="780" y="414" text-anchor="middle" fill="#12181a" font-size="14" font-weight="700">C</text>
    </g>
  </g>
  <text x="480" y="480" text-anchor="middle" fill="#cfc4b2" font-size="14" font-family="sans-serif">Die Verbindung entsteht im Kopf des Zuschauers – nicht durch einen gemeinsamen Frame.</text>
</svg>
