<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Die fünf Master-Posen von Prima: stehend, rollend, Kopf gesenkt, Hand ausgestreckt, Auge offen">
  <defs>
    <radialGradient id="eye" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#ffdf9e"/>
      <stop offset="0.55" stop-color="#e8a83c"/>
      <stop offset="1" stop-color="#b06a1a"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171f21"/>
      <stop offset="1" stop-color="#0e1416"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Pose 1: stehend -->
  <g>
    <rect x="108" y="150" width="40" height="58" rx="14" fill="#6f6f6f"/>
    <ellipse cx="132" cy="190" rx="50" ry="48" fill="#e6dcc6"/>
    <path d="M96 182 q10 6 20 2" stroke="#a8623a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="115" cy="184" r="18" fill="url(#eye)"/>
    <line x1="134" y1="146" x2="134" y2="118" stroke="#c03322" stroke-width="5" stroke-linecap="round"/>
    <circle cx="134" cy="114" r="7" fill="#ff5a3c"/>
    <rect x="112" y="234" width="18" height="26" rx="8" fill="#b9ad94"/>
    <rect x="136" y="234" width="18" height="26" rx="8" fill="#b9ad94"/>
    <ellipse cx="132" cy="266" rx="56" ry="8" fill="#000" opacity="0.35"/>
    <text x="132" y="300" text-anchor="middle" fill="#8a8378" font-size="15" font-family="sans-serif">stehend</text>
  </g>

  <!-- Pose 2: rollend -->
  <g>
    <rect x="298" y="158" width="40" height="58" rx="14" fill="#6f6f6f"/>
    <ellipse cx="322" cy="196" rx="50" ry="48" fill="#e6dcc6"/>
    <path d="M286 190 q10 6 20 2" stroke="#a8623a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="305" cy="190" r="18" fill="url(#eye)"/>
    <line x1="324" y1="152" x2="324" y2="124" stroke="#c03322" stroke-width="5" stroke-linecap="round"/>
    <circle cx="324" cy="120" r="7" fill="#ff5a3c"/>
    <!-- Räder statt Beine -->
    <circle cx="306" cy="246" r="14" fill="#2a2a2a"/>
    <circle cx="338" cy="246" r="14" fill="#2a2a2a"/>
    <ellipse cx="322" cy="266" rx="56" ry="8" fill="#000" opacity="0.35"/>
    <text x="322" y="300" text-anchor="middle" fill="#8a8378" font-size="15" font-family="sans-serif">rollend</text>
  </g>

  <!-- Pose 3: Kopf gesenkt -->
  <g>
    <rect x="488" y="158" width="40" height="58" rx="14" fill="#6f6f6f"/>
    <ellipse cx="512" cy="200" rx="50" ry="48" fill="#e0d6c0"/>
    <path d="M476 194 q10 6 20 2" stroke="#a8623a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="496" cy="208" r="18" fill="url(#eye)" opacity="0.75"/>
    <line x1="516" y1="156" x2="504" y2="128" stroke="#7a3325" stroke-width="5" stroke-linecap="round"/>
    <circle cx="504" cy="124" r="6" fill="#5a2a20"/>
    <rect x="492" y="244" width="18" height="26" rx="8" fill="#b9ad94"/>
    <rect x="516" y="244" width="18" height="26" rx="8" fill="#b9ad94"/>
    <ellipse cx="512" cy="276" rx="56" ry="8" fill="#000" opacity="0.35"/>
    <text x="512" y="300" text-anchor="middle" fill="#8a8378" font-size="15" font-family="sans-serif">Kopf gesenkt</text>
  </g>

  <!-- Pose 4: Hand ausgestreckt -->
  <g>
    <rect x="678" y="150" width="40" height="58" rx="14" fill="#6f6f6f"/>
    <ellipse cx="702" cy="190" rx="50" ry="48" fill="#e6dcc6"/>
    <path d="M666 182 q10 6 20 2" stroke="#a8623a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="685" cy="184" r="18" fill="url(#eye)"/>
    <line x1="704" y1="146" x2="704" y2="118" stroke="#c03322" stroke-width="5" stroke-linecap="round"/>
    <circle cx="704" cy="114" r="7" fill="#ff5a3c"/>
    <!-- ausgestreckter Arm -->
    <line x1="656" y1="184" x2="612" y2="150" stroke="#d8ccb4" stroke-width="13" stroke-linecap="round"/>
    <rect x="682" y="234" width="18" height="26" rx="8" fill="#b9ad94"/>
    <rect x="706" y="234" width="18" height="26" rx="8" fill="#b9ad94"/>
    <ellipse cx="702" cy="266" rx="56" ry="8" fill="#000" opacity="0.35"/>
    <text x="702" y="300" text-anchor="middle" fill="#8a8378" font-size="15" font-family="sans-serif">Hand ausgestreckt</text>
  </g>

  <!-- Pose 5: Auge offen -->
  <g>
    <rect x="858" y="158" width="36" height="58" rx="14" fill="#6f6f6f"/>
    <ellipse cx="880" cy="196" rx="46" ry="46" fill="#e6dcc6"/>
    <path d="M848 188 q10 6 18 2" stroke="#a8623a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- größeres, offenes Auge -->
    <circle cx="866" cy="190" r="24" fill="url(#eye)"/>
    <circle cx="858" cy="182" r="8" fill="#fff3d6" opacity="0.9"/>
    <line x1="882" y1="154" x2="882" y2="128" stroke="#c03322" stroke-width="5" stroke-linecap="round"/>
    <circle cx="882" cy="124" r="7" fill="#ff5a3c"/>
    <rect x="862" y="238" width="16" height="26" rx="8" fill="#b9ad94"/>
    <rect x="884" y="238" width="16" height="26" rx="8" fill="#b9ad94"/>
    <ellipse cx="880" cy="270" rx="52" ry="8" fill="#000" opacity="0.35"/>
    <text x="880" y="300" text-anchor="middle" fill="#8a8378" font-size="15" font-family="sans-serif">Auge offen</text>
  </g>

  <!-- Randlinie -->
  <rect x="0.5" y="0.5" width="959" height="539" fill="none" stroke="#d97a2b" stroke-opacity="0.3" stroke-width="1"/>
</svg>
